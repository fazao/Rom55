<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Entre em contato com a Agência Rom55." />
  <title>Contato | Agência Rom55</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <!-- Vercel Web Analytics -->
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>

  <header class="header">
    <div class="container">
      <a href="../index.html" class="logo">Rom55</a>
      <nav class="nav">
        <a href="../index.html">Início</a>
        <a href="sobre.html">Sobre</a>
        <a href="servicos.html">Serviços</a>
        <a href="contato.html">Contato</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Fale com a gente</h1>
        <p>Tem um projeto em mente? Conta pra nós — adoramos boas ideias.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <form class="form" action="#" method="post">
          <div>
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required />
          </div>
          <div>
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" required />
          </div>
          <div>
            <label for="assunto">Assunto</label>
            <input type="text" id="assunto" name="assunto" placeholder="Sobre o que você quer falar?" />
          </div>
          <div>
            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" placeholder="Descreva seu projeto ou dúvida..." required></textarea>
          </div>
          <div>
            <button type="submit" class="btn">Enviar mensagem</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Agência Rom55. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
